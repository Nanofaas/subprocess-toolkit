[project]
name = "shellcraft"
version = "0.1.0"
description = "Generic subprocess orchestration toolkit for Python DevOps tooling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[build-system]
# >=77 is required for the PEP 639 `license` / `license-files` fields above;
# older setuptools rejects the SPDX string form.
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    # Pinned exactly to match the ruff-pre-commit revision in
    # .pre-commit-config.yaml. A newer ruff in either place makes the hook and a
    # local `ruff check` disagree about what a violation is. Bump both together.
    "ruff==0.16.7",
    # basedpyright rather than mypy: it is the type checker the sibling
    # projects use, and the goal is one stack across all of them.
    "basedpyright>=1.39.3",
    "bandit>=1.8",
    "pre-commit>=4.0",
]

# =============================================================================
# Ruff - linting + formatting
# =============================================================================
#   uv run ruff check .          # lint
#   uv run ruff check --fix .    # lint + apply safe fixes
#   uv run ruff format .         # format
#
# This project has no legacy to carry, so the rule set here is strict. The
# library is a thin, typed wrapper around subprocess and container/kubectl
# invocations with a deliberately curated public API (see shellcraft.__all__),
# and it is small enough that "strict now" costs less than "ratchet later".

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/shellcraft.egg-info"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "RUF",   # Ruff-specific rules
    "PERF",  # Perflint
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
    "ARG",   # unused arguments (the suite already suppresses one by design)
    "D",     # pydocstyle - this is a library with a public API
]
ignore = [
    # Mutually exclusive summary conventions. Summary on the first line (D212)
    # is the chosen convention, so its counterpart D213 is off; D203 pairs with
    # D211 the same way.
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Test functions are documented by their name; requiring a docstring on every
# one of them is noise, not documentation. The whole missing-docstring family is
# therefore off for the test tree. Style rules (D2xx/D4xx) still apply.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.isort]
known-first-party = ["shellcraft"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# =============================================================================
# basedpyright - type checking
# =============================================================================
# The shared choice across these projects. `standard` is the mode: it catches
# real type errors without the opinionated extras that `recommended` turns on
# (reportAny, reportUnusedCallResult and friends), which fire mostly on the
# untyped third-party surface this library is a thin wrapper over.
#
# reportMissingTypeStubs and reportPrivateUsage are off for the same reason the
# sibling projects turn them off: tests reach into internals deliberately, and
# several dependencies ship without stubs.

[tool.basedpyright]
include = ["src/shellcraft", "tests"]
typeCheckingMode = "standard"
# reportImplicitOverride is deliberately NOT enabled here, although some sibling
# projects enable it. It requires marking overrides with @override, and
# typing.override only exists from Python 3.12 - on 3.11 that means importing
# typing_extensions at runtime. shellcraft's selling point is being stdlib-only
# with zero runtime dependencies, which is not worth trading for a lint rule.
# Enable it if the floor ever moves to 3.12.
reportMissingTypeStubs = false
reportPrivateUsage = false
venvPath = "."
venv = ".venv"

# =============================================================================
# pytest
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
branch = true
source = ["shellcraft"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Measured at 99.6% when this was set: every module is at 100% except one
# partial branch in backend.py. The gate sits slightly lower because CI runs a
# 3.11/3.12/3.13 matrix and branch coverage moves a little between versions -
# a gate that flakes is worse than one that lags. Raise it as coverage improves;
# never lower it to make a build pass.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# =============================================================================
# Bandit - security static analysis
# =============================================================================
# This library exists to shell out to docker/podman/kubectl, so subprocess is
# its subject matter, not a smell. SubprocessShell builds command lists and
# never passes shell=True, so B602 stays enabled: a future shell=True - the
# actual injection vector - must fail the build.

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    # B404 (import subprocess), B603 (subprocess call), B607 (partial path):
    # unavoidable for a subprocess orchestration toolkit that has to call
    # whatever container runtime the caller configures.
    "B404",
    "B603",
    "B607",
]
