# Pre-commit hooks for shellcraft.
#
#   uv run pre-commit install          # enable on commit
#   uv run pre-commit run --all-files  # run everything once
#
# Version policy: the ruff revision below MUST stay in sync with the `ruff`
# pin in pyproject.toml. A newer ruff in pre-commit than in the dev environment
# makes the hook report violations that `uv run ruff check` does not.
#
# No default_language_version is set on purpose. Pinning it to python3.11 made
# pre-commit fail outright on a machine without that interpreter on PATH, and
# the hooks that need the project's own interpreter (mypy) run through
# `uv run --frozen` against the venv that .python-version pins anyway. The
# ruff hook ships a prebuilt binary, so its env's interpreter does not affect
# results.

fail_fast: false

repos:
  # ---------------------------------------------------------------------------
  # Ruff - lint + format
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (format)

  # ---------------------------------------------------------------------------
  # Type checking
  #
  # Runs through the project environment rather than mirrors-mypy: mypy has to
  # resolve `shellcraft` itself, and the config in pyproject.toml sets
  # strict = true with an explicit file list.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        types: [python]

  # ---------------------------------------------------------------------------
  # Security
  #
  # B602 (shell=True) is deliberately not skipped anywhere: SubprocessShell
  # builds argv lists and never passes shell=True, and that must stay true.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        # pre-commit passes explicit filenames, which bypasses bandit's own
        # exclude_dirs - so the test tree has to be excluded here as well.
        exclude: ^tests/

  # ---------------------------------------------------------------------------
  # Generic file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: mixed-line-ending
        args: [--fix=lf]
